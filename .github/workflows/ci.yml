name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statops
          POSTGRES_PASSWORD: statops
          POSTGRES_DB: statops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://statops:statops@localhost:5432/statops_test
          JWT_SECRET_KEY: ci-secret-not-used-in-prod
        run: alembic upgrade head
      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET_KEY: ci-secret-not-used-in-prod
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
